", "深色模式", "深色模式"], "print": ["Print / PDF", "打印 / PDF", "列印 / PDF"], "clear": ["Clear entries", "清空填写内容", "清空填寫內容"], "confirm": ["Erase all entries in this page?", "确定清空本页填写内容吗？", "確定清空本頁填寫內容嗎？"], "now": ["Need help right now?", "现在就需要帮助？", "現在就需要協助？"], "urgent": ["If there is immediate danger, serious injury, an overdose, or you may act on self-harm thoughts now: call 911 in the U.S. or your local emergency number. Move toward safety if you can. Do not wait to finish this plan or for a clinician to reply.", "如有迫在眉睫的危险、严重受伤、药物过量，或可能立即伤害自己：在美国请拨打 911；其他地区请拨打当地急救电话。在可行的情况下前往安全处。不要等填完计划或等咨询师回复才求助。", "如有迫在眉睫的危險、嚴重受傷、藥物過量，或可能立即傷害自己：在美國請撥打 911；其他地區請撥打當地急救電話。在可行的情況下前往安全處。不要等填完計畫或等諮商師回覆才求助。"], "helptext": ["U.S. resources below. Outside the U.S., use local crisis and domestic violence services. Calling, texting, or opening links may leave a record.", "以下为美国资源。美国以外地区，请使用当地危机及家暴支持服务。通话、短信或打开链接可能留下记录。", "以下為美國資源。美國以外地區，請使用當地危機及家暴支援服務。通話、簡訊或開啟連結可能留下紀錄。"], "crisis": ["Emotional crisis: call or text 988", "心理危机：拨打或发短信至 988", "心理危機：撥打或傳簡訊至 988"], "dv": ["Domestic violence: 800-799-7233", "家暴支持：800-799-7233", "家暴支援：800-799-7233"], "dvtext": ["Or text START to 88788. An advocate can help plan for staying, leaving, or after leaving.", "也可发送 START 至 88788。支持人员可协助制定留在关系中、准备离开或离开后的安全计划。", "也可傳送 START 至 88788。支援人員可協助制定留在關係中、準備離開或離開後的安全計畫。"], "text": ["Crisis Text Line: text HOME to 741741", "危机短信支持：发送 HOME 至 741741", "危機簡訊支援：傳送 HOME 至 741741"], "build": ["Build my plan", "制定我的计划", "制定我的計畫"], "review": ["My plan at a glance", "查看我的计划", "查看我的計畫"], "support": ["Get support", "求助资源", "求助資源"], "progress": ["sections with an entry — not a safety score", "个部分已有填写；这不是安全评分", "個部分已有填寫；這不是安全評分"], "hint": ["Tap an idea to add it. Edit it to make it yours.", "点选提示即可加入，再按自己的情况修改。", "點選提示即可加入，再按自己的情況修改。"], "optional": ["Optional. Use names or details only if safe.", "选填。仅在安全时记录姓名或具体信息。", "選填。僅在安全時記錄姓名或具體資訊。"], "empty": ["Not filled in yet.", "尚未填写。", "尚未填寫。"], "s0": ["Notice my warning signs", "觉察预警信号", "覺察預警訊號"], "d0": ["What tells me I need support? Include thoughts, feelings, body signals, situations, or another person’s threatening behavior.", "哪些变化提醒我需要支持？可以是想法、情绪、身体反应、特定情境，或他人的威胁行为。", "哪些變化提醒我需要支援？可以是想法、情緒、身體反應、特定情境，或他人的威脅行為。"], "a0_0": ["I withdraw from people", "我开始回避他人", "我開始迴避他人"], "a0_1": ["I feel trapped or overwhelmed", "我感到被困住或难以承受", "我感到被困住或難以承受"], "a0_2": ["Threats or monitoring increase", "威胁或监控加剧", "威脅或監控加劇"], "s1": ["Find a steadier moment", "先让自己稳一点", "先讓自己穩一點"], "d1": ["If I am physically safe, what can help me settle or shift my attention? Calming myself is not a substitute for getting away from danger.", "在身体安全的前提下，什么能帮助我平复情绪或转移注意？安抚自己不能代替脱离危险。", "在身體安全的前提下，什麼能幫助我平復情緒或轉移注意？安撫自己不能代替脫離危險。"], "a1_0": ["Read or listen to familiar music", "阅读或听熟悉的音乐", "閱讀或聽熟悉的音樂"], "a1_1": ["Notice my feet on the floor", "感受双脚接触地面", "感受雙腳接觸地面"], "a1_2": ["Use a cool washcloth", "用凉毛巾敷脸", "用涼毛巾敷臉"], "s2": ["Speak to myself with care", "用关怀的方式对自己说话", "用關懷的方式對自己說話"], "d2": ["What words feel believable and helpful? Include what has helped before.", "哪些话让我觉得可信、能带来支持？也可以写下过去帮助过自己的话。", "哪些話讓我覺得可信、能帶來支援？也可以寫下過去幫助過自己的話。"], "a2_0": ["I can focus on the next safe step.", "我可以先关注下一步怎样更安全。", "我可以先關注下一步怎樣更安全。"], "a2_1": ["I can ask for help before things get worse.", "我可以在情况恶化前求助。", "我可以在情況惡化前求助。"], "s3": ["Connect with safe people & places", "联系安全的人，找到安全的地方", "聯繫安全的人，找到安全的地方"], "d3": ["Who or where helps me feel less alone? List safe ways to contact them, phone numbers, and a backup if no one answers. Separate people for distraction from people I can tell that I am unsafe.", "谁或哪里能让我不那么孤单？写下安全的联系方式、电话号码及无人回应时的备选。区分能陪我转移注意的人，以及能直接告诉对方“我不安全”的人。", "誰或哪裡能讓我不那麼孤單？寫下安全的聯絡方式、電話號碼及無人回應時的備選。區分能陪我轉移注意的人，以及能直接告訴對方「我不安全」的人。"], "s4": ["Ask for the help I need", "说清楚我需要什么帮助", "說清楚我需要什麼協助"], "d4": ["What can a safe person do? Agree on a code word and what action it means, if useful. Do not share the plan with someone who may harm or control me.", "安全的人可以怎样帮助我？如有需要，可约定暗号及收到暗号后的行动。不要把计划分享给可能伤害或控制自己的人。", "安全的人可以怎樣協助我？如有需要，可約定暗號及收到暗號後的行動。不要把計畫分享給可能傷害或控制自己的人。"], "a4_0": ["Please stay with me or stay on the phone.", "请陪着我，或保持通话。", "請陪著我，或保持通話。"], "a4_1": ["Please help me reach professional support.", "请帮我联系专业支持。", "請幫我聯繫專業支援。"], "s5": ["Make my surroundings safer", "让周围环境更安全", "讓周圍環境更安全"], "d5": ["What practical changes are safe for me? If self-harm is a concern, ask a trusted person to help reduce access to dangerous items. Do not handle weapons or confront someone to remove them.", "哪些实际调整对我来说是安全的？若担心伤害自己，可请可信任的人协助减少接触危险物品。不要自行处理武器，也不要为移走物品而与他人对峙。", "哪些實際調整對我來說是安全的？若擔心傷害自己，可請可信任的人協助減少接觸危險物品。不要自行處理武器，也不要為移走物品而與他人對峙。"], "s6": ["Reach professional support", "联系专业支持", "聯繫專業支援"], "d6": ["List my clinician, crisis service, domestic violence advocate, and nearest emergency department, with phone numbers and addresses. What is my backup outside office hours? If I cannot stay safe, seek emergency help now; do not wait for other steps to work.", "写下咨询师、危机服务、家暴支持人员及最近急诊的电话和地址。非工作时间可以找谁？如果无法确保安全，请立即寻求紧急帮助，不必等其他步骤奏效。", "寫下諮商師、危機服務、家暴支援人員及最近急診的電話和地址。非工作時間可以找誰？如果無法確保安全，請立即尋求緊急協助，不必等其他步驟奏效。"], "s7": ["Keep what matters close", "记住对我重要的事", "記住對我重要的事"], "d7": ["What person, pet, value, hope, or small future moment helps me keep going? Who can help create this plan, who can safely keep a copy, and when will we review it?", "哪些人、宠物、价值、希望，或未来的小事支持我继续走下去？谁能陪我制定计划？谁可以安全地保留副本？我们何时一起回顾？", "哪些人、寵物、價值、希望，或未來的小事支援我繼續走下去？誰能陪我制定計畫？誰可以安全地保留副本？我們何時一起回顧？"], "abuse": ["If someone is hurting, threatening, or controlling me", "如果有人伤害、威胁或控制我", "如果有人傷害、威脅或控制我"], "abuselong": ["Safety planning is not a requirement to leave. Choose steps that fit your situation with a domestic violence advocate. Leaving can increase danger; do not announce plans if that could put you at risk. If safe, consider an exit route, transport, a safe destination, medicines, keys, documents, and plans for children or pets. Children should seek safety, not intervene. Avoid storing locations or code words here if someone could find them.", "安全计划不代表必须离开。可以和家暴支持人员一起选择适合自己的步骤；离开可能增加危险，若公开计划会带来风险，请勿告知对方。在安全的前提下，考虑撤离路线、交通、安全去处、药物、钥匙、证件，以及孩子或宠物的安排。孩子应先保护自己，不要介入冲突。如果他人可能发现，请不要在这里记录去处或暗号。", "安全計畫不代表必須離開。可以和家暴支援人員一起選擇適合自己的步驟；離開可能增加危險，若公開計畫會帶來風險，請勿告知對方。在安全的前提下，考慮撤離路線、交通、安全去處、藥物、鑰匙、證件，以及孩子或寵物的安排。孩子應先保護自己，不要介入衝突。如果他人可能發現，請不要在這裡記錄去處或暗號。"], "exportwarn": ["Print or save only on a safe device. PDFs, downloads, and print queues can expose your plan. This page is not monitored and cannot send help. A completed plan does not guarantee safety. Review it with a clinician or advocate, especially after a crisis or a change in circumstances.", "仅在安全设备上打印或保存。PDF、下载文件和打印队列可能暴露计划。本页无人实时查看，不能派出救援。填完计划不代表安全已有保障。请与咨询师或支持人员一起回顾，尤其在危机之后或处境改变时。", "僅在安全裝置上列印或儲存。PDF、下載檔案和列印佇列可能暴露計畫。本頁無人即時查看，不能派出救援。填完計畫不代表安全已有保障。請與諮商師或支援人員一起回顧，尤其在危機之後或處境改變時。"], "sources": ["Resource & safety information", "资源与安全信息", "資源與安全資訊"], "footer": ["Developed by", "开发：", "開發："], "brand": ["Mind X Associates", "Mind X社区", "Mind X社區"], "top": ["Back to top", "返回顶部", "返回頂部"]};let lang=1;const fields=[...document.querySelectorAll('textarea')];function tr(k){return dict[k][lang]}function render(){document.documentElement.lang=['en','zh-Hans','zh-Hant'][lang];document.title=tr('title');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));document.querySelectorAll('textarea').forEach(e=>e.placeholder=tr('optional'));document.getElementById('top').ariaLabel=tr('top');update()}function update(){let n=0;const box=document.getElementById('summary');box.replaceChildren();fields.forEach((f,i)=>{if(f.value.trim())n++;const row=document.createElement('div');row.className='reviewitem';const h=document.createElement('h3');h.textContent=(i+1)+'. '+tr('s'+i);const p=document.createElement('p');p.textContent=f.value.trim()||tr('empty');row.append(h,p);box.append(row)});document.querySelector('progress').value=n;document.getElementById('count').textContent=n+' / 8'}fields.forEach(f=>f.addEventListener('input',update));document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const f=fields[Number(b.dataset.field)],s=tr(b.dataset.add);if(!f.value.split('\n').includes(s))f.value+=(f.value?'\n':'')+s;update();f.focus()}));document.getElementById('theme').onclick=()=>{const on=document.body.classList.toggle('dark');document.getElementById('theme').setAttribute('aria-pressed',on)};if(matchMedia('(prefers-color-scheme: dark)').matches){document.body.classList.add('dark');document.getElementById('theme').setAttribute('aria-pressed','true')}document.getElementById('print').onclick=()=>{update();window.print()};document.getElementById('clear').onclick=()=>{if(confirm(tr('confirm'))){fields.forEach(f=>f.value='');update()}};function leave(){fields.forEach(f=>f.value='');update();location.replace('https://www.google.com/')}document.getElementById('exit').onclick=leave;let esc=0;document.addEventListener('keydown',e=>{if(e.key==='Escape'){const now=Date.now();if(now-esc<1000)leave();esc=now}});document.getElementById('top').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});const lb=document.getElementById('language');if(lb)lb.onclick=()=>{lang=lang===1?2:1;lb.textContent=lang===1?'繁體中文':'简体中文';render()};window.addEventListener('beforeprint',update);render();</script></body></html>
